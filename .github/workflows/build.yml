name: Build and publish memory sheet

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Typst
        uses: typst-community/setup-typst@v5
      - name: Build PDF/A
        run: make compile
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v7
        with:
          name: Memory-Sheet
          path: build/memorysheet.pdf
          if-no-files-found: error

  deploy-nextcloud:
    if: >-
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    env:
      NC_WEBDAV_URL: ${{ secrets.NC_WEBDAV_URL }}
      NC_WEBDAV_USERNAME: ${{ secrets.NC_WEBDAV_USERNAME }}
      NC_WEBDAV_PW: ${{ secrets.NC_WEBDAV_PW }}
    steps:
      - name: Download PDF artifact
        uses: actions/download-artifact@v8
        with:
          name: Memory-Sheet
          path: build
      - name: Upload to Nextcloud through WebDAV
        if: env.NC_WEBDAV_URL != '' && env.NC_WEBDAV_USERNAME != '' && env.NC_WEBDAV_PW != ''
        run: curl --fail --show-error --upload-file build/memorysheet.pdf --user "$NC_WEBDAV_USERNAME:$NC_WEBDAV_PW" "$NC_WEBDAV_URL/memorysheet.pdf"
