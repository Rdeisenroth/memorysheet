name: Build and publish memory sheet

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Typst
        uses: typst-community/setup-typst@v5
      - name: Restore Arial font cache
        id: arial-font-cache
        uses: actions/cache@v6
        with:
          path: .fonts/arial
          key: arial-fonts-v1
      - name: Install Arial fonts
        if: steps.arial-font-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .fonts/arial /tmp/memorysheet-fonts
          curl --fail --location --output /tmp/memorysheet-fonts/arial.zip https://befonts.com/wp-content/uploads/2022/09/arial-font.zip
          unzip -q /tmp/memorysheet-fonts/arial.zip -d /tmp/memorysheet-fonts/extracted
          find /tmp/memorysheet-fonts/extracted -type f \( -iname '*.ttf' -o -iname '*.otf' \) -exec cp {} .fonts/arial/ \;
          test -n "$(find .fonts/arial -type f -name '*.ttf' -o -name '*.otf')"
      - name: Build PDF/A
        env:
          TYPST_FONT_PATHS: ${{ github.workspace }}/.fonts/arial
        run: make compile
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v7
        with:
          name: Memory-Sheet
          path: build/memorysheet.pdf
          if-no-files-found: error

  deploy-nextcloud:
    if: >-
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    env:
      NC_WEBDAV_URL: ${{ secrets.NC_WEBDAV_URL }}
      NC_WEBDAV_USERNAME: ${{ secrets.NC_WEBDAV_USERNAME }}
      NC_WEBDAV_PW: ${{ secrets.NC_WEBDAV_PW }}
    steps:
      - name: Download PDF artifact
        uses: actions/download-artifact@v8
        with:
          name: Memory-Sheet
          path: build
      - name: Upload to Nextcloud through WebDAV
        if: env.NC_WEBDAV_URL != '' && env.NC_WEBDAV_USERNAME != '' && env.NC_WEBDAV_PW != ''
        run: curl --fail --show-error --upload-file build/memorysheet.pdf --user "$NC_WEBDAV_USERNAME:$NC_WEBDAV_PW" "$NC_WEBDAV_URL/memorysheet.pdf"
